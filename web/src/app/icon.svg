<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A pantry cupboard with two shelves of jars, in the flat style of src/components/graphics.tsx.
       Colors mirror the theme tokens in globals.css (light, then dark). -->
  <style>
    .cupboard { fill: #3e5a47; }
    .back { fill: #f7f1e8; }
    .saffron { fill: #d29b35; }
    .mulberry { fill: #8c2e4c; }
    .paprika { fill: #a3361f; }
    @media (prefers-color-scheme: dark) {
      .cupboard { fill: #9fbba6; }
      .back { fill: #1c1614; }
      .saffron { fill: #c8913a; }
      .mulberry { fill: #e08ba5; }
      .paprika { fill: #e8806a; }
    }
  </style>
  <rect x="2" y="1.5" width="28" height="29" rx="3" class="cupboard" />
  <rect x="5" y="4.5" width="22" height="23" rx="1" class="back" />
  <rect x="5" y="15" width="22" height="2.5" class="cupboard" />
  <!-- Top shelf: a jar, an apple, an onion -->
  <rect x="6.5" y="7" width="5.5" height="8" rx="1.5" class="saffron" />
  <circle cx="16.6" cy="11.7" r="3.3" class="paprika" />
  <path d="M16.6 8.6 C16.9 7.4 17.6 6.6 18.8 6.4 C18.6 7.6 17.8 8.4 16.6 8.6 Z" class="cupboard" />
  <path d="M23.7 6.5 C24.8 8.8 27 9.8 27 11.7 A3.3 3.3 0 0 1 20.4 11.7 C20.4 9.8 22.6 8.8 23.7 6.5 Z" class="mulberry" />
  <!-- Bottom shelf: a cheese wedge, a jar, a loaf -->
  <path d="M6.5 27.5 L13 27.5 L13 21 Z" class="saffron" />
  <circle cx="11.2" cy="25.4" r="0.9" class="back" />
  <rect x="14.5" y="19" width="5" height="8.5" rx="1.5" class="mulberry" />
  <path d="M20.5 27.5 V24.3 A3 3 0 0 1 26.5 24.3 V27.5 Z" class="paprika" />
</svg>
